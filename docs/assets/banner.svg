<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gate — a local control plane for human-reviewed AI development">
  <defs>
    <radialGradient id="glowBlue" cx="18%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#3a70a4" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3a70a4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="90%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#6948b4" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#6948b4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64d8ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9d8cff" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <mask id="gridMask">
      <rect width="1200" height="260" fill="url(#fade)"/>
    </mask>
  </defs>

  <rect width="1200" height="260" fill="#06080c"/>
  <rect width="1200" height="260" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1200" height="260" fill="url(#glowBlue)"/>
  <rect width="1200" height="260" fill="url(#glowViolet)"/>

  <!-- console corner brackets -->
  <path d="M 22 40 L 22 22 L 40 22" fill="none" stroke="#5c6c82" stroke-width="1.4" opacity="0.6"/>
  <path d="M 1178 220 L 1178 238 L 1160 238" fill="none" stroke="#5c6c82" stroke-width="1.4" opacity="0.6"/>

  <!-- brand mark -->
  <rect x="60" y="88" width="64" height="64" rx="14" fill="url(#markFill)" stroke="#64d8ff" stroke-opacity="0.45" stroke-width="1.3"/>
  <text x="92" y="130" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="800" fill="#64d8ff">GT</text>

  <!-- wordmark -->
  <text x="146" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="46" font-weight="700" letter-spacing="1" fill="#eef4fb">GATE</text>
  <text x="148" y="147" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3" fill="#64d8ff">GATED AGENT TIMELINE ENGINE</text>
  <text x="148" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#7e8b9e">Local control plane for human-reviewed AI development</text>

  <!-- mile-marker rail motif -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <line x1="700" y1="130" x2="1140" y2="130" stroke="#38424f" stroke-width="1.5" stroke-dasharray="2 6"/>

    <circle cx="700" cy="130" r="16" fill="hsl(12 75% 62% / 0.16)" stroke="hsl(12 75% 62%)" stroke-width="2.2"/>
    <text x="700" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="hsl(12 75% 62%)">1</text>
    <text x="700" y="164" text-anchor="middle" font-size="10" fill="#c2ccda">A</text>

    <circle cx="810" cy="130" r="16" fill="hsl(152 60% 56% / 0.16)" stroke="hsl(152 60% 56%)" stroke-width="2.2"/>
    <text x="810" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="hsl(152 60% 56%)">2</text>
    <text x="810" y="164" text-anchor="middle" font-size="10" fill="#c2ccda">B</text>

    <circle cx="920" cy="130" r="16" fill="hsl(202 82% 64% / 0.12)" stroke="hsl(202 82% 64%)" stroke-width="2.2" stroke-dasharray="3 3" opacity="0.75"/>
    <text x="920" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="hsl(202 82% 64%)">3</text>
    <text x="920" y="164" text-anchor="middle" font-size="9" letter-spacing="1.5" fill="#f7c76a">GATED</text>

    <circle cx="1030" cy="130" r="16" fill="hsl(262 72% 68% / 0.16)" stroke="hsl(262 72% 68%)" stroke-width="2.2"/>
    <text x="1030" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="hsl(262 72% 68%)">4</text>
    <text x="1030" y="164" text-anchor="middle" font-size="10" fill="#c2ccda">D</text>

    <circle cx="1140" cy="130" r="16" fill="hsl(336 74% 64% / 0.16)" stroke="hsl(336 74% 64%)" stroke-width="2.2"/>
    <text x="1140" y="135" text-anchor="middle" font-size="11" font-weight="700" fill="hsl(336 74% 64%)">5</text>
    <text x="1140" y="164" text-anchor="middle" font-size="10" fill="#c2ccda">E</text>
  </g>

  <text x="700" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.5" fill="#505c6d">timeline &#8594; worktree &#8594; evidence &#8594; human gate</text>
</svg>
